name: PhoneMirror

options:
  bundleIdPrefix: com.edunavajas
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PhoneMirrorSend:
    type: application
    platform: iOS
    sources:
      - path: PhoneMirrorSend
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edunavajas.phonemirror.send
        INFOPLIST_FILE: PhoneMirrorSend/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PhoneMirrorBroadcast

  PhoneMirrorBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: PhoneMirrorBroadcast
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edunavajas.phonemirror.send.broadcast
        INFOPLIST_FILE: PhoneMirrorBroadcast/Info.plist
        GENERATE_INFOPLIST_FILE: NO

schemes:
  PhoneMirrorSend:
    build:
      targets:
        PhoneMirrorSend: all
    run:
      config: Debug
